name: Run Python Script Periodically

on:
  schedule:
    # الجدول الزمني بنظام CRON
    # المثال التالي يشغل الكود كل 6 ساعات (الساعة 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  
  # يتيح لك تشغيل السكربت يدوياً في أي وقت لاختباره من واجهة GitHub
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      -- name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Execute Python script
        run: python main.py
